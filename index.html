<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naval Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== START / LOADING SCREEN ========== -->
<div id="start-screen">
  <h1>Naval Card Game</h1>

  <div class="ship-name" id="fact-ship-name">HMS Javelin</div>

  <img id="fact-image" src="HMS_Javelin_stern_damage.png" alt="Ship" class="fact-image" onerror="this.style.display='none'">

  <div class="ship-fact-text" id="fact-text">
    Loading fact...
  </div>

  <button id="start-btn">Start Game</button>
</div>

  <!-- ========== NATION SELECT SCREEN ========== -->
  <div id="nation-select" style="display: none;">
    <h1>Choose Your Nation</h1>

    <div class="nation-buttons">
      <!-- BRITAIN -->
      <div class="nation-card" id="select-britain">
        <div class="card britain" style="width: 180px; height: 260px; cursor: pointer;">
          <h2 style="margin-top: 100px; color: white; text-shadow: 0 0 8px black;">Great Britain</h2>
        </div>
      </div>

      <!-- FRANCE -->
      <div class="nation-card" id="select-france">
        <div class="card france freefrench" style="width: 180px; height: 260px; cursor: pointer;">
          <h2 style="margin-top: 100px; color: white; text-shadow: 0 0 8px black;">France</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== ACTUAL GAME ========== -->
  <div id="game-screen" style="display: none;">

    <h1>Naval Card Game</h1>

    <div id="top-bar">
      <div id="turn-display">Turn 1</div>
      <button id="end-turn">END TURN</button>
    </div>

    <div class="battlefield">

      <!-- ENEMY -->
      <div class="zone">
        <h2>Enemy Deck</h2>
        <div id="enemy-deck" class="deck-zone"></div>
      </div>

      <div class="zone">
        <h2>Enemy Support Line</h2>
        <div id="enemy-energy">Energy: 0</div>
        <div id="enemy-support" class="battle-row"></div>
      </div>

      <!-- FRONTLINE -->
      <div class="zone">
        <h2>Frontline</h2>
        <div id="frontline" class="battle-row"></div>
      </div>

      <!-- PLAYER -->
      <div class="zone">
        <h2>Player Support Line</h2>
        <div id="player-energy">Energy: 1</div>
        <div id="player-support" class="battle-row"></div>
      </div>

      <div class="zone">
        <h2>Your Hand</h2>
        <div id="player-hand" class="hand-row"></div>
      </div>

    </div>
  </div>

  <script src="nation.js"></script>
  <script src="game.js"></script>
</body>
</html>
