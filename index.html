<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Naval Card Game
</title>

<link
rel="stylesheet"
href="style.css"
/>

</head>

<body>

<h1>
Naval Card Game
</h1>

<div id="top-bar">

<div id="turn-display">
Turn 1
</div>

<button id="end-turn">
END TURN
</button>

</div>

<div class="battlefield">

<!-- ENEMY -->

<div class="zone">

<h2>
Enemy Deck
</h2>

<div
id="enemy-deck"
class="deck-zone"
></div>

</div>

<div class="zone">

<h2>
Enemy Support Line
</h2>
<div id="enemy-energy">
Energy: 0
</div>

<div
id="enemy-support"
class="battle-row"
></div>

</div>

<div class="zone">

<h2>

</div>

<!-- PLAYER -->

<div class="zone">

<h2>
Frontline
</h2>

<div
id="frontline"
class="battle-row"
></div>

</div>

<div class="zone">

<h2>
Player Support Line
</h2>
<div id="player-energy">
Energy: 1
</div>

<div
id="player-support"
class="battle-row"
></div>

</div>

<div class="zone">

<h2>
Your Hand
</h2>

<div
id="player-hand"
class="hand-row"
></div>

</div>

</div>

<script src="britain.js"></script>
<script src="france.js"></script>
<script src="game.js"></script>

</body>

</html>
